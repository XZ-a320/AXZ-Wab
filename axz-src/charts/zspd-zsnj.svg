<!-- ZSPD -> ZSNJ 示意图. Geometry measured off the project's own chart render
     (Pictures/ZSPD-ZSNJ.jpg, 915x633) and normalised. 示意图 only — never to be
     labelled a navigation chart. Cruise level 31,100 ft is 9,500 m: a real
     Chinese metric RVSM level. It is correct. Do not "fix" it to 31,000. -->
<svg viewBox="0 0 915 633" role="img" aria-labelledby="t-pvg d-pvg" class="plate-svg">
  <title id="t-pvg">ZSPD 至 ZSNJ 航线示意图</title>
  <desc id="d-pvg">去程航路自上海浦东国际机场向西，沿 R343 航路经 SASAN、ESBAG 两个航路点，抵达南京禄口国际机场。全程约280公里，巡航高度31,100英尺（9,500米）。</desc>

  <!-- the Yangtze delta and Lake Tai, the two landmarks the site names -->
  <g class="plate-terrain" aria-hidden="true">
    <path d="M60 190 q120 -40 240 -10 t260 20"/>
    <ellipse cx="415" cy="392" rx="72" ry="46"/>
    <path d="M700 120 q80 60 150 90"/>
  </g>

  <!-- airway R343 -->
  <g class="plate-airway" aria-hidden="true">
    <path d="M178 271 L365 302 L505 311 L845 428"/>
  </g>

  <path class="plate-track track-path" d="M845 428 L505 311 L365 302 L178 271"/>

  <g aria-hidden="true">
    <circle class="plate-dep" cx="845" cy="428" r="7"/>
    <g class="plate-wpt">
      <circle cx="505" cy="311" r="6"/><path d="M505 306 l5 8 h-10 z"/>
      <circle cx="365" cy="302" r="6"/><path d="M365 297 l5 8 h-10 z"/>
    </g>
    <circle class="plate-arr" cx="178" cy="271" r="7"/>
    <g class="plate-fix">
      <path d="M640 220 l6 10 h-12 z"/><path d="M280 420 l6 10 h-12 z"/>
      <path d="M700 500 l6 10 h-12 z"/>
    </g>
  </g>

  <g class="plate-label">
    <text x="858" y="424">ZSPD</text>
  </g>
  <g class="plate-label plate-label--wpt">
    <text x="519" y="308">SASAN</text>
    <text x="379" y="299">ESBAG</text>
  </g>
  <g class="plate-label plate-label--awy">
    <text x="660" y="358" transform="rotate(19 660 358)">R343</text>
  </g>
  <g class="plate-label plate-label--arr">
    <text x="120" y="267">ZSNJ</text>
    <text x="108" y="285">NANJING</text>
  </g>

  <g aria-hidden="true">
    <path class="plate-fix" d="M60 596 h130 M60 591 v10 M190 591 v10"/>
    <text class="plate-label" x="60" y="586">100 km</text>
  </g>

  <!-- The aircraft flies the filed routing. offset-path uses the SAME geometry
       as the track above, so it can never drift out of agreement with it.
       Static state: parked at the destination end (see plate.css). -->
  <g class="plate-ship" style="--track-d: path('M845 428 L505 311 L365 302 L178 271')" aria-hidden="true">
    <path class="plate-ship-glyph" transform="scale(2.1)" d="M 7 0 L -2 -3.4 L -0.6 0 L -2 3.4 Z M -0.2 0 L -5.6 -4.6 L -6.8 -4.6 L -4.2 0 L -6.8 4.6 L -5.6 4.6 Z"/>
  </g>
</svg>
